name: Deploy nest.js to Server

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Add to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          
      - name: Execute SSH command
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 5m  # Correct parameter name
          script: |
            cd /termin/test_termin/backend_termin_calender
            git stash
            git pull 
            npm install
            npm run build
            pm2 delete test-termin-backend || true
            PORT=4102 pm2 start /termin/test_termin/backend_termin_calender/dist/src/main.js --name "test-termin-backend"
            pm2 save
            pm2 startup